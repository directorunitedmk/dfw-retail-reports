<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFW Retail Investment Property Report</title>
<style>
  :root {
    --bg: #0d0d14;
    --card: #15151f;
    --card-border: #24242f;
    --gold: #e8a020;
    --text: #e9e9ee;
    --text-dim: #9a9aab;
    --text-dimmer: #6b6b7a;
    --green: #3ecf6a;
    --red: #e2536b;
    --blue: #4b9bff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    padding: 28px 20px 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  header .subtitle {
    color: var(--text-dim);
    font-size: 14px;
  }
  header .subtitle b { color: var(--gold); }

  .stat-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px 16px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 130px;
    flex: 1 1 130px;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--gold); }
  .stat .label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .filter-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(13,13,20,0.96);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--card-border);
    padding: 12px 20px;
  }
  .filter-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .filter-inner select, .filter-inner input[type="number"] {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
  }
  .filter-inner label {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .chip-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-dim);
    user-select: none;
  }
  .chip-toggle.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(232,160,32,0.08);
  }
  .filter-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-dim);
  }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  .source-status {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.7;
  }
  .source-status b { color: var(--text); }
  .source-status .ok { color: var(--green); }
  .source-status .blocked { color: var(--red); }
  .source-status .zero { color: var(--text-dimmer); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .photo-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    background: #1c1c28;
    overflow: hidden;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .badges {
    position: absolute;
    top: 8px;
    left: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: calc(100% - 16px);
  }
  .badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .badge.pick { background: var(--gold); color: #241a02; }
  .badge.source { background: rgba(0,0,0,0.65); color: #fff; }
  .badge.match { background: var(--blue); color: #05132b; }
  .dom-pill {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 6px;
    color: #111;
  }
  .dom-pill.green { background: var(--green); }
  .dom-pill.gold { background: var(--gold); }
  .dom-pill.red { background: var(--red); color: #fff; }
  .dom-pill.gray { background: #4a4a58; color: #d8d8e0; }

  .no-photo {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dimmer);
    font-size: 13px;
  }

  .card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
  }
  .card-address {
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    font-size: 12px;
    margin-top: 4px;
  }
  .stats-grid .k { color: var(--text-dimmer); }
  .stats-grid .v { color: var(--text); font-weight: 600; }
  .stats-grid .v.gold { color: var(--gold); }
  .notes {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
  }
  .view-btn {
    margin-top: auto;
    display: block;
    text-align: center;
    background: var(--gold);
    color: #241a02;
    font-weight: 700;
    font-size: 13px;
    padding: 9px;
    border-radius: 8px;
    text-decoration: none;
  }
  .view-btn:hover { opacity: 0.9; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  footer {
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px 20px 50px;
    color: var(--text-dimmer);
    font-size: 12px;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .filter-inner { gap: 8px; }
  }
</style>
</head>
<body>

<header>
  <h1>DFW Retail Investment Property Report</h1>
  <div class="subtitle">Generated <b id="report-date"></b> &middot; New-to-market listings surfaced across 11 broker/marketplace sources</div>
</header>

<div class="stat-bar" id="stat-bar"></div>

<div class="filter-bar">
  <div class="filter-inner">
    <label>Sort
      <select id="sortSelect">
        <option value="newest">Newest</option>
        <option value="cap-desc">Cap Rate (high-low)</option>
        <option value="price-asc">Price (low-high)</option>
        <option value="price-desc">Price (high-low)</option>
        <option value="sf-desc">Size (large-small)</option>
      </select>
    </label>
    <label>Min Cap
      <input type="number" id="minCap" placeholder="e.g. 5" step="0.1" style="width:70px">
    </label>
    <label>Max Price ($)
      <input type="number" id="maxPrice" placeholder="e.g. 5000000" step="100000" style="width:110px">
    </label>
    <div class="chip-toggle" id="matchToggle">⭐ Criteria Match Only</div>
    <div class="chip-toggle" id="photoToggle">📷 Has Photo</div>
    <div class="filter-count" id="filterCount"></div>
  </div>
</div>

<main>
  <div class="source-status" id="source-status"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty-state" style="display:none">No listings match the current filters.</div>
</main>

<footer id="footer"></footer>

  {name: "Crexi", status: "blocked", note: "listing pages stuck on loading skeleton (both Dallas & Fort Worth URLs); no listing API observed"},
  {name: "STRIVE", status: "zero", note: "20 DFW listings reviewed, 11 retail — all previously tracked"},
  {name: "Secure Net Lease", status: "zero", note: "site UI showed false \"no results\"; used wp-json API directly — 7 DFW listings, all previously tracked"},
  {name: "SRS", status: "zero", note: "map/location filter repeatedly froze; reviewed national \"Newest Listings\" feed — zero DFW for-sale retail items present"},
  {name: "Marcus & Millichap", status: "zero", note: "Retail+Net Lease, Dallas TX (covers MSA), Most Recent sort — 16 results, all previously tracked (fixed 7 malformed tracker URLs in the process)"},

function fmtMoney(n) {
  if (!n) return null;
  return '$' + n.toLocaleString('en-US');
}
function fmtSF(n) {
  if (!n) return null;
  return n.toLocaleString('en-US') + ' SF';
}

function domPillInfo(item) {
  // We don't have reliable days-on-market data from any source this run.
  return {cls: 'gray', label: 'DOM n/a'};
}

function render() {
  const sort = document.getElementById('sortSelect').value;
  const minCap = parseFloat(document.getElementById('minCap').value) || null;
  const maxPrice = parseFloat(document.getElementById('maxPrice').value) || null;
  const matchOnly = document.getElementById('matchToggle').classList.contains('active');
  const photoOnly = document.getElementById('photoToggle').classList.contains('active');

  let items = LISTINGS.slice();

  if (minCap !== null) items = items.filter(i => i.cap_rate && i.cap_rate >= minCap);
  if (maxPrice !== null) items = items.filter(i => i.price && i.price <= maxPrice);
  if (matchOnly) items = items.filter(i => i.criteria_match);
  if (photoOnly) items = items.filter(i => i.photos && i.photos.length);

  if (sort === 'cap-desc') items.sort((a,b) => (b.cap_rate||0) - (a.cap_rate||0));
  else if (sort === 'price-asc') items.sort((a,b) => (a.price||Infinity) - (b.price||Infinity));
  else if (sort === 'price-desc') items.sort((a,b) => (b.price||0) - (a.price||0));
  else if (sort === 'sf-desc') items.sort((a,b) => (b.sf||0) - (a.sf||0));
  // 'newest' = source insertion order (already newest-first per source feed)

  document.getElementById('filterCount').textContent = items.length + ' of ' + LISTINGS.length + ' shown';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('empty-state').style.display = items.length ? 'none' : 'block';

  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'card';

    const photo = document.createElement('div');
    photo.className = 'photo-wrap';
    if (item.photos && item.photos.length) {
      const img = document.createElement('img');
      img.src = item.photos[0];
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.onerror = function() { this.closest('.photo-wrap').style.display = 'none'; };
      photo.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'no-photo';
      ph.textContent = 'No photo available';
      photo.appendChild(ph);
    }

    const badges = document.createElement('div');
    badges.className = 'badges';
    const srcBadge = document.createElement('span');
    srcBadge.className = 'badge source';
    srcBadge.textContent = item.source;
    badges.appendChild(srcBadge);
    if (item.criteria_match) {
      const mb = document.createElement('span');
      mb.className = 'badge match';
      mb.textContent = 'Criteria Match';
      badges.appendChild(mb);
    }
    photo.appendChild(badges);

    const dom = domPillInfo(item);
    const domEl = document.createElement('div');
    domEl.className = 'dom-pill ' + dom.cls;
    domEl.textContent = dom.label;
    photo.appendChild(domEl);

    card.appendChild(photo);

    const body = document.createElement('div');
    body.className = 'card-body';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = item.name;
    body.appendChild(title);

    const addr = document.createElement('div');
    addr.className = 'card-address';
    addr.textContent = item.address;
    body.appendChild(addr);

    const sg = document.createElement('div');
    sg.className = 'stats-grid';
    const priceStr = fmtMoney(item.price) || item.price_display || 'Contact Broker';
    sg.innerHTML = `
      <div class="k">Price</div><div class="v">${priceStr}</div>
      <div class="k">Cap Rate</div><div class="v gold">${item.cap_rate ? item.cap_rate + '%' : '—'}</div>
      <div class="k">Size</div><div class="v">${fmtSF(item.sf) || (item.acres ? item.acres + ' AC' : '—')}</div>
      <div class="k">Type</div><div class="v">${item.type || 'Retail'}</div>
    `;
    body.appendChild(sg);

    if (item.status || item.dom_note) {
      const notes = document.createElement('div');
      notes.className = 'notes';
      notes.textContent = [item.status, item.dom_note].filter(Boolean).join(' · ');
      body.appendChild(notes);
    }

    const btn = document.createElement('a');
    btn.className = 'view-btn';
    btn.href = item.url;
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.textContent = 'View Listing';
    body.appendChild(btn);

    card.appendChild(body);
    grid.appendChild(card);
  }
}

function buildStatBar() {
  const caps = LISTINGS.map(i => i.cap_rate).filter(Boolean);
  const prices = LISTINGS.map(i => i.price).filter(Boolean);
  const matchCount = LISTINGS.filter(i => i.criteria_match).length;
  const capRange = caps.length ? Math.min(...caps).toFixed(2) + '% – ' + Math.max(...caps).toFixed(2) + '%' : '—';
  const priceRange = prices.length ? fmtMoney(Math.min(...prices)) + ' – ' + fmtMoney(Math.max(...prices)) : '—';

  const stats = [
    {num: LISTINGS.length, label: 'New Listings Today'},
    {num: matchCount, label: 'Criteria Match'},
    {num: capRange, label: 'Cap Rate Range'},
    {num: priceRange, label: 'Price Range (priced only)'},
  ];
  const bar = document.getElementById('stat-bar');
  bar.innerHTML = stats.map(s => `<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join('');
}

function buildSourceStatus() {
  const el = document.getElementById('source-status');
  const parts = SOURCE_STATUS.map(s => {
    const cls = s.status === 'ok' ? 'ok' : (s.status === 'blocked' ? 'blocked' : 'zero');
    const label = s.status === 'ok' ? '✓' : (s.status === 'blocked' ? '✗ blocked' : '– 0 new');
    return `<div><b>${s.name}</b> <span class="${cls}">${label}</span> — ${s.note}</div>`;
  });
  el.innerHTML = '<div style="margin-bottom:8px;color:var(--text)"><b>Source coverage this run:</b></div>' + parts.join('');
}

function buildFooter() {
  document.getElementById('footer').innerHTML =
    'DOM (days-on-market) data was not reliably exposed by any source this run, so all pills read "DOM n/a" rather than risk a false ⭐ Top Pick claim. ' +
    '"New" means the listing was not present in the cross-session tracker before this run — the strongest recency signal available given each site’s data. ' +
    'Report built for Vincent · United MK.';
}

document.getElementById('report-date').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('minCap').addEventListener('input', render);
document.getElementById('maxPrice').addEventListener('input', render);
document.getElementById('matchToggle').addEventListener('click', function(){ this.classList.toggle('active'); render(); });
document.getElementById('photoToggle').addEventListener('click', function(){ this.classList.toggle('active'); render(); });

buildStatBar();
buildSourceStatus();
buildFooter();
render();
</script>
