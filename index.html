<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFW Retail Investment Property Report</title>
<style>
:root{
  --bg:#0d0d14; --gold:#e8a020; --card:#15151f; --card-border:#232332;
  --text:#e8e8ec; --text-dim:#9a9aab; --green:#3ecf6e; --red:#e0524d;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
header{padding:28px 24px 16px;border-bottom:1px solid var(--card-border);}
header h1{margin:0 0 4px;font-size:1.6em;color:var(--gold);}
header p{margin:0;color:var(--text-dim);font-size:0.92em;}
.statbar{display:flex;gap:14px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--card-border);}
.stat{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:10px 16px;min-width:120px;}
.stat .n{font-size:1.3em;font-weight:700;color:var(--gold);}
.stat .l{font-size:0.75em;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
.filterbar{position:sticky;top:0;z-index:10;background:rgba(13,13,20,0.97);backdrop-filter:blur(6px);
  padding:12px 24px;border-bottom:1px solid var(--card-border);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filterbar label{font-size:0.78em;color:var(--text-dim);margin-right:4px;}
.filterbar select,.filterbar input{background:var(--card);color:var(--text);border:1px solid var(--card-border);
  border-radius:6px;padding:6px 8px;font-size:0.85em;}
.filterbar .grp{display:flex;align-items:center;gap:6px;}
.filterbar button{background:var(--gold);color:#1a1200;border:none;border-radius:6px;padding:6px 12px;font-size:0.82em;font-weight:600;cursor:pointer;}
.count{color:var(--text-dim);font-size:0.82em;margin-left:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:22px 24px 60px;}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.photo-wrap{position:relative;height:170px;background:#1a1a26;}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;}
.badge{font-size:0.7em;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.badge.top{background:var(--gold);color:#1a1200;}
.badge.match{background:#2a5fd6;color:#fff;}
.badge.source{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);color:#fff;font-size:0.68em;padding:3px 8px;border-radius:20px;}
.dompill{position:absolute;bottom:8px;left:8px;font-size:0.7em;font-weight:700;padding:3px 9px;border-radius:20px;color:#000;}
.dompill.green{background:var(--green);}
.dompill.gold{background:var(--gold);}
.dompill.red{background:var(--red);color:#fff;}
.dompill.gray{background:#666;color:#fff;}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.name{font-weight:700;font-size:1.02em;margin:0;}
.addr{color:var(--text-dim);font-size:0.85em;margin:0;}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:6px 0;font-size:0.82em;}
.statsgrid div span{display:block;}
.statsgrid .lbl{color:var(--text-dim);font-size:0.75em;text-transform:uppercase;}
.statsgrid .capval{color:var(--gold);font-weight:700;}
.notes{font-size:0.8em;color:var(--text-dim);line-height:1.4;}
.viewbtn{margin-top:auto;display:inline-block;text-align:center;background:transparent;border:1px solid var(--gold);
  color:var(--gold);padding:8px;border-radius:8px;text-decoration:none;font-size:0.85em;font-weight:600;}
.viewbtn:hover{background:var(--gold);color:#1a1200;}
.sectionhead{padding:18px 24px 4px;color:var(--text-dim);font-size:0.85em;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--card-border);margin-top:10px;}
footer{padding:24px;color:var(--text-dim);font-size:0.78em;border-top:1px solid var(--card-border);line-height:1.6;}
</style>
</head>

const today = new Date("2026-09-10");
function domPillClass(dom){
  if(dom===null||dom===undefined) return "gray";
  if(dom<=30) return "green";
  if(dom<=90) return "gold";
  return "red";
}
function domLabel(l){
  if(l.dom===null||l.dom===undefined) return "DOM n/a";
  return l.dom+" DOM";
}
function render(){
  const minCap = parseFloat(document.getElementById('minCap').value)||0;
  const maxPrice = parseFloat(document.getElementById('maxPrice').value)||Infinity;
  const topOnly = document.getElementById('topOnly').checked;
  const matchOnly = document.getElementById('matchOnly').checked;
  const sortBy = document.getElementById('sortSel').value;

  let items = LISTINGS.filter(l=>{
    if((l.cap||0) < minCap) return false;
    if(l.price && l.price > maxPrice) return false;
    if(topOnly && !l.topPick) return false;
    if(matchOnly && !l.criteriaMatch) return false;
    return true;
  });

  items.sort((a,b)=>{
    if(sortBy==='cap') return (b.cap||0)-(a.cap||0);
    if(sortBy==='price') return (b.price||0)-(a.price||0);
    if(sortBy==='sf'){
      const sfNum = s=> s? (parseInt(String(s).split('').filter(function(c){return c>='0'&&c<='9';}).join(''))||0) : 0;
      return sfNum(b.sf)-sfNum(a.sf);
    }
    if(a.topPick!==b.topPick) return b.topPick-a.topPick;
    const ad=a.dom===null?999:a.dom, bd=b.dom===null?999:b.dom;
    return ad-bd;
  });

  document.getElementById('resultCount').textContent = items.length+' of '+LISTINGS.length+' listings';

  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(function(l){
    const badges = [];
    if(l.topPick) badges.push('<span class="badge top">⭐ Top Pick</span>');
    if(l.criteriaMatch) badges.push('<span class="badge match">Criteria Match</span>');
    const photo = l.photo ? ('<img src="'+l.photo+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest(&#39;.photo-wrap&#39;).style.display=&#39;none&#39;">') : '';
    let html = '';
    html += '<div class="card">';
    html += '  <div class="photo-wrap">';
    html += photo;
    html += '    <div class="badges">'+badges.join('')+'</div>';
    html += '    <span class="badge source">'+l.source+'</span>';
    html += '    <span class="dompill '+domPillClass(l.dom)+'">'+domLabel(l)+'</span>';
    html += '  </div>';
    html += '  <div class="body">';
    html += '    <p class="name">'+l.name+'</p>';
    html += '    <p class="addr">'+l.address+'</p>';
    html += '    <div class="statsgrid">';
    html += '      <div><span class="lbl">Price</span><span>'+l.priceDisplay+'</span></div>';
    html += '      <div><span class="lbl">Cap Rate</span><span class="capval">'+(l.cap?l.cap+'%':'—')+'</span></div>';
    html += '      <div><span class="lbl">Size</span><span>'+(l.sf?l.sf+' SF':'—')+'</span></div>';
    html += '      <div><span class="lbl">Occupancy</span><span>'+(l.occupancy||'—')+'</span></div>';
    html += '    </div>';
    if(l.tenants) html += '    <div class="notes"><strong>Tenants:</strong> '+l.tenants+'</div>';
    if(l.notes) html += '    <div class="notes">'+l.notes+'</div>';
    html += '    <a class="viewbtn" href="'+l.url+'" target="_blank" rel="noopener">View Listing</a>';
    html += '  </div>';
    html += '</div>';
    return html;
  }).join('');
}
function resetFilters(){
  document.getElementById('minCap').value='';
  document.getElementById('maxPrice').value='';
  document.getElementById('topOnly').checked=false;
  document.getElementById('matchOnly').checked=false;
  document.getElementById('sortSel').value='newest';
  render();
}
['minCap','maxPrice','topOnly','matchOnly','sortSel'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

(function(){
  const total = LISTINGS.length;
  const newIn3 = LISTINGS.filter(l=>l.dom!==null && l.dom<=3).length;
  const caps = LISTINGS.filter(l=>l.cap).map(l=>l.cap);
  const prices = LISTINGS.filter(l=>l.price).map(l=>l.price);
  const capRange = caps.length? (Math.min(...caps).toFixed(2)+'% – '+Math.max(...caps).toFixed(2)+'%') : '—';
  const priceRange = prices.length? ('$'+Math.min(...prices).toLocaleString()+' – $'+Math.max(...prices).toLocaleString()) : '—';
  document.getElementById('statbar').innerHTML =
    '<div class="stat"><div class="n">'+total+'</div><div class="l">Total Listings</div></div>'+
    '<div class="stat"><div class="n">'+newIn3+'</div><div class="l">New in 3 Days</div></div>'+
    '<div class="stat"><div class="n">'+capRange+'</div><div class="l">Cap Rate Range</div></div>'+
    '<div class="stat"><div class="n">'+priceRange+'</div><div class="l">Price Range</div></div>';
})();
