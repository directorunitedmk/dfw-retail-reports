  header{padding:24px 28px 12px;}
  h1{margin:0 0 4px;font-size:26px;color:var(--gold);}
  .sub{color:var(--muted);font-size:14px;}
  .statbar{display:flex;flex-wrap:wrap;gap:14px;padding:0 28px 16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:140px;}
  .stat .num{font-size:20px;font-weight:700;color:var(--gold);}
  .stat .lbl{font-size:12px;color:var(--muted);}
  .filterbar{position:sticky;top:0;z-index:10;background:rgba(13,13,20,0.97);backdrop-filter:blur(6px);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 28px;border-bottom:1px solid var(--border);}
  .filterbar label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
  select,input[type=number]{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;}
  .chk{flex-direction:row!important;align-items:center;gap:6px!important;}
  .chk input{width:15px;height:15px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:20px 28px 60px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .photo-wrap{position:relative;height:180px;background:#1c1c28;}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .badges{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;color:#0d0d14;}
  .badge.pick{background:var(--gold);}
  .badge.match{background:#7ab8ff;}
  .badge.source{background:#3a3a4a;color:var(--text);}
  .dom-pill{position:absolute;bottom:8px;right:8px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#0d0d14;}
  .dom-green{background:var(--green);} .dom-gold{background:var(--gold);} .dom-red{background:var(--red);color:#fff;} .dom-gray{background:var(--gray);color:#fff;}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .name{font-size:16px;font-weight:700;margin:0;}
  .addr{font-size:13px;color:var(--muted);margin:0;}
  .statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;}
  .statsgrid div span.k{color:var(--muted);display:block;font-size:11px;}
  .statsgrid div span.v{font-weight:600;}
  .statsgrid .cap span.v{color:var(--gold);}
  .notes{font-size:12.5px;color:var(--muted);line-height:1.4;}
  .viewbtn{margin-top:auto;text-align:center;background:var(--gold);color:#0d0d14;font-weight:700;text-decoration:none;padding:9px;border-radius:8px;font-size:13px;}
  .viewbtn:hover{opacity:0.9;}
  .sectiontitle{padding:20px 28px 0;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
</style>
</head>

function domClass(dom){ if(dom==null) return "dom-gray"; if(dom<=30) return "dom-green"; if(dom<=90) return "dom-gold"; return "dom-red"; }
function domLabel(dom){ if(dom==null) return "n/a"; return dom+" DOM"; }

function render(){
  const sort = document.getElementById('sortSel').value;
  const minCap = parseFloat(document.getElementById('minCap').value)||0;
  const maxPrice = parseFloat(document.getElementById('maxPrice').value)||Infinity;
  const topOnly = document.getElementById('topOnly').checked;
  const matchOnly = document.getElementById('matchOnly').checked;

  let items = listings.filter(l=>{
    if((l.cap||0) < minCap) return false;
    if(l.price!=null && l.price > maxPrice) return false;
    if(topOnly && !l.top) return false;
    if(matchOnly && !l.match) return false;
    return true;
  });

  if(sort==='cap') items.sort((a,b)=>(b.cap||0)-(a.cap||0));
  else if(sort==='price') items.sort((a,b)=>(a.price||Infinity)-(b.price||Infinity));
  else if(sort==='sf') items.sort((a,b)=>(b.sf||0)-(a.sf||0));
  else items.sort((a,b)=>(a.dom||99)-(b.dom||99));

  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(l=>`
    <div class="card">
      <div class="photo-wrap">
        ${l.photo ? `<img src="${l.photo}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.photo-wrap').style.display='none'">` : ''}
        <div class="badges">
          ${l.top?'<span class="badge pick">⭐ Top Pick</span>':''}
          <span class="badge source">${l.source}</span>
          ${l.match?'<span class="badge match">Criteria Match</span>':''}
        </div>
        <div class="dom-pill ${domClass(l.dom)}">${domLabel(l.dom)}</div>
      </div>
      <div class="body">
        <p class="name">${l.name}</p>
        <p class="addr">${l.addr}</p>
        <div class="statsgrid">
          <div><span class="k">Price</span><span class="v">${fmtMoney(l.price)}</span></div>
          <div class="cap"><span class="k">Cap Rate</span><span class="v">${l.cap!=null? l.cap+'%':'—'}</span></div>
          <div><span class="k">Size</span><span class="v">${fmtSF(l.sf)}</span></div>
          <div><span class="k">Source</span><span class="v">${l.source}</span></div>
        </div>
        <div class="notes">${l.notes}</div>
        <a class="viewbtn" href="${l.url}" target="_blank" rel="noopener">View Listing</a>
      </div>
    </div>
  `).join('');

  document.getElementById('statbar').innerHTML = `
    <div class="stat"><div class="num">${listings.length}</div><div class="lbl">Total New Listings</div></div>
    <div class="stat"><div class="num">${listings.filter(l=>l.dom<=3).length}</div><div class="lbl">New in ≤3 Days</div></div>
    <div class="stat"><div class="num">${listings.filter(l=>l.match).length}</div><div class="lbl">Criteria Matches</div></div>
    <div class="stat"><div class="num">${(()=>{const p=listings.filter(l=>l.price).map(l=>l.price); return p.length? '$'+Math.min(...p).toLocaleString()+' – $'+Math.max(...p).toLocaleString():'—';})()}</div><div class="lbl">Price Range</div></div>
    <div class="stat"><div class="num">${(()=>{const c=listings.filter(l=>l.cap).map(l=>l.cap); return c.length? Math.min(...c)+'% – '+Math.max(...c)+'%':'—';})()}</div><div class="lbl">Cap Rate Range</div></div>
  `;
}
['sortSel','minCap','maxPrice','topOnly','matchOnly'].forEach(id=>document.getElementById(id).addEventListener('input', render));
render();
</script>
</body>
</html>
