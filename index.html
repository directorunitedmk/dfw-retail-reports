<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFW Retail Investment Report — Sep 14, 2026</title>
<style>
:root{--bg:#0d0d14;--card:#15151f;--card2:#1c1c28;--gold:#e8a020;--txt:#e9e9f0;--mut:#8b8b9e;--line:#26263a;--grn:#3ec46d;--red:#e05252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 60px}
header{padding:34px 0 18px;border-bottom:1px solid var(--line)}
h1{margin:0 0 6px;font-size:27px;letter-spacing:-.4px}
h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-size:20px;color:var(--gold);font-weight:600}
.stat i{font-style:normal;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.bar{position:sticky;top:0;z-index:20;background:rgba(13,13,20,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:22px}
.bar .in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.f{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
select,input[type=number]{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px}
input[type=number]{width:110px}
.chk{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:13px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--gold);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.photo-wrap{position:relative;aspect-ratio:716/444;background:var(--card2);overflow:hidden}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.dom{position:absolute;left:10px;bottom:10px;color:#000;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.d-new{background:var(--grn)}.d-mid{background:var(--gold)}.d-old{background:var(--red)}.d-na{background:#9a9aae}
.badges{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 0}
.bdg{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.b-top{background:var(--gold);color:#000}
.b-src{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.b-cri{background:#2a4d34;color:var(--grn);border:1px solid #376b46}
.b-uc{background:#4d2a2a;color:#f09a9a;border:1px solid #6b3737}
.body{padding:10px 14px 16px;display:flex;flex-direction:column;flex:1}
.nm{font-size:16px;font-weight:600;margin:0 0 3px;line-height:1.3}
.ad{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:11px}
.sg div i{display:block;font-style:normal;color:var(--mut);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.sg div b{font-weight:600;font-size:13px}
.sg .cap b{color:var(--gold)}
.tn{font-size:12.5px;color:var(--mut);margin-bottom:14px;flex:1}
.tn b{color:var(--txt);font-weight:600}
.btn{display:block;text-align:center;background:var(--gold);color:#000;text-decoration:none;font-weight:700;font-size:13px;padding:10px;border-radius:8px}
.btn:hover{filter:brightness(1.1)}
.none{color:var(--mut);padding:40px 0;text-align:center}
footer{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px}
footer b{color:var(--txt)}
</style>
</head>

<option value="phi">Price (high→low)</option>
<option value="sf">Size (large→small)</option>

<label class="f">Min cap</label><input type="number" id="mincap" step="0.25" placeholder="%">
<label class="f">Max price</label><input type="number" id="maxprice" step="100000" placeholder="$">
<span class="chk"><input type="checkbox" id="toponly"><span>⭐ Top picks only</span></span>
<span class="chk"><input type="checkbox" id="crionly"><span>Criteria match only</span></span>
</div></div>
<div class="wrap"><div class="grid" id="grid"></div>
<footer id="foot"></footer></div>

function money(v){return v==null?"—":"$"+v.toLocaleString("en-US")}
function domCls(d){if(d==null)return"d-na";if(d<=30)return"d-new";if(d<=90)return"d-mid";return"d-old"}
function domTxt(d){return d==null?"DOM n/a":d+(d===1?" day":" days")+" on market"}
function hideImg(el){var w=el.closest(".photo-wrap");if(w)w.style.display="none"}
function render(){
 var sort=document.getElementById("sort").value;
 var mc=parseFloat(document.getElementById("mincap").value);
 var mp=parseFloat(document.getElementById("maxprice").value);
 var top=document.getElementById("toponly").checked;
 var cri=document.getElementById("crionly").checked;
 var L=D.filter(function(x){
  if(top&&!(x.dom!=null&&x.dom<=3))return false;
  if(cri&&!x.cri)return false;
  if(!isNaN(mc)&&!(x.c!=null&&x.c>=mc))return false;
  if(!isNaN(mp)&&!(x.p!=null&&x.p<=mp))return false;
  return true;});
 L.sort(function(a,b){
  if(sort==="cap")return (b.c==null?-1:b.c)-(a.c==null?-1:a.c);
  if(sort==="plo")return (a.p==null?1e15:a.p)-(b.p==null?1e15:b.p);
  if(sort==="phi")return (b.p==null?-1:b.p)-(a.p==null?-1:a.p);
  if(sort==="sf")return (b.sf==null?-1:b.sf)-(a.sf==null?-1:a.sf);
  return (a.dom==null?999:a.dom)-(b.dom==null?999:b.dom);});
 var g=document.getElementById("grid");
 if(!L.length){g.innerHTML='<div class="none">No listings match these filters.</div>';return}
 g.innerHTML=L.map(function(x){
  var isTop=x.dom!=null&&x.dom<=3;
  var ph=x.img?'<div class="photo-wrap"><img loading="lazy" referrerpolicy="no-referrer" onerror="hideImg(this)" src="'+x.img+'" alt=""><span class="dom '+domCls(x.dom)+'">'+domTxt(x.dom)+'</span></div>':'';
  return '<article class="card">'+ph+
  '<div class="badges">'+(isTop?'<span class="bdg b-top">⭐ Top Pick</span>':'')+
  '<span class="bdg b-src">'+x.src+'</span>'+
  (x.cri?'<span class="bdg b-cri">Criteria Match</span>':'')+
  (x.uc?'<span class="bdg b-uc">Under Contract</span>':'')+'</div>'+
  '<div class="body"><h2 class="nm">'+x.n+'</h2><div class="ad">'+x.a+'</div>'+
  '<div class="sg"><div><i>Price</i><b>'+money(x.p)+'</b></div>'+
  '<div class="cap"><i>Cap</i><b>'+(x.c!=null?x.c.toFixed(2)+"%":"—")+'</b></div>'+
  '<div><i>Size</i><b>'+(x.sf!=null?x.sf.toLocaleString("en-US")+" SF":"—")+'</b></div>'+
  '<div><i>Occupancy</i><b>'+(x.dom!=null?"New":"Active")+'</b></div></div>'+
  '<div class="tn">'+(x.oc?'<b>'+x.oc+'</b><br>':'')+x.t+'</div>'+
  '<a class="btn" href="'+x.u+'" target="_blank" rel="noopener">View Listing →</a></div></article>';
 }).join("");
}
(function(){
 var caps=D.filter(function(x){return x.c!=null}).map(function(x){return x.c});
 var prs=D.filter(function(x){return x.p!=null}).map(function(x){return x.p});
 var n3=D.filter(function(x){return x.dom!=null&&x.dom<=3}).length;
 document.getElementById("stats").innerHTML=
  '<div class="stat"><b>'+D.length+'</b><i>New listings</i></div>'+
  '<div class="stat"><b>'+n3+'</b><i>On market ≤3 days</i></div>'+
  '<div class="stat"><b>'+Math.min.apply(null,caps).toFixed(2)+'–'+Math.max.apply(null,caps).toFixed(2)+'%</b><i>Cap range</i></div>'+
  '<div class="stat"><b>$'+(Math.min.apply(null,prs)/1000).toFixed(0)+'K–$'+(Math.max.apply(null,prs)/1e6).toFixed(1)+'M</b><i>Price range</i></div>'+
  '<div class="stat"><b>'+D.filter(function(x){return x.cri}).length+'</b><i>Criteria matches</i></div>';
 document.getElementById("foot").innerHTML='<b>Sources swept:</b> Crexi, STRIVE, Secure Net Lease, SRS, Marcus &amp; Millichap, Matthews, Colliers, CBRE, NAI Robert Lynn, LoopNet, SHOP Companies.<br><b>Issues this run:</b> LoopNet served a bot-protection blank page (not bypassed). CBRE&rsquo;s search app hung in a perpetual loading state after two attempts. Crexi and Marcus &amp; Millichap cap the number of results their APIs return, so coverage is the newest page of each rather than an exhaustive sweep. Listings without a published list date show &ldquo;DOM n/a&rdquo; and are new relative to the cross-session tracker rather than confirmed new-to-market.<br><br>Generated 2026-09-14 · deduplicated against dfw-seen-listings.json';
 ["sort","mincap","maxprice","toponly","crionly"].forEach(function(id){
  var e=document.getElementById(id);e.addEventListener("change",render);e.addEventListener("input",render);});
 render();
})();
</script>
