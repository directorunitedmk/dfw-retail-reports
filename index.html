<style>
:root{
  --bg:#0d0d14; --card:#15151f; --card2:#1b1b28; --gold:#e8a020; --text:#e8e6e0;
  --muted:#8a8896; --line:#26263a; --green:#3ecf6a; --red:#e05252;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding-bottom:60px}
header{padding:28px 24px 18px;max-width:1280px;margin:0 auto}
header h1{font-size:26px;letter-spacing:.5px}
header h1 span{color:var(--gold)}
header .sub{color:var(--muted);margin-top:6px;font-size:14px}
.statbar{display:flex;flex-wrap:wrap;gap:12px;max-width:1280px;margin:10px auto 0;padding:0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:150px}
.stat .v{font-size:20px;font-weight:700;color:var(--gold)}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.controls{position:sticky;top:0;z-index:50;background:rgba(13,13,20,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-top:18px}
.controls .inner{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls label{font-size:12px;color:var(--muted)}
.controls select,.controls input[type=number]{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.controls input[type=number]{width:110px}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text)}
.grid{max-width:1280px;margin:22px auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.photo-wrap{position:relative;height:200px;background:#10101a}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.dom-pill{position:absolute;bottom:8px;left:8px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#000}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(0,0,0,.72);color:var(--text);border:1px solid var(--line)}
.badge.top{background:var(--gold);color:#000;border-color:var(--gold)}
.badge.match{background:#2a6b3f;color:#dff5e6;border-color:#2a6b3f}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{font-size:16px;line-height:1.3}
.addr{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;background:var(--card2);border-radius:8px;padding:10px}
.stats div{text-align:center}
.stats .v{font-size:13px;font-weight:700}
.stats .v.cap{color:var(--gold)}
.stats .l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.notes{font-size:12.5px;color:#b9b7c4;line-height:1.45}
.btn{margin-top:auto;display:block;text-align:center;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:9px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{background:var(--gold);color:#000}
.footer{max-width:1280px;margin:30px auto 0;padding:0 24px;color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>

function money(p){return p==null?'Unpriced':'$'+p.toLocaleString()}
function domPill(d){
  if(d==null)return '<span class="dom-pill" style="background:#9a99a6">DOM n/a</span>';
  const c = d<=30?'var(--green)':(d<=90?'var(--gold)':'var(--red)');
  return '<span class="dom-pill" style="background:'+c+'">'+(d===0?'NEW TODAY':d+'d on market')+'</span>';
}
function card(x){
  const top = x.dom!=null && x.dom<=3;
  const badges = '<div class="badges">'+(top?'<span class="badge top">⭐ Top Pick</span>':'')+'<span class="badge">'+x.src+'</span>'+(x.match?'<span class="badge match">Criteria Match</span>':'')+'</div>';
  const photo = x.img?('<div class="photo-wrap"><img src="'+x.img+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest(\'.photo-wrap\').style.display=\'none\'">'+badges+domPill(x.dom)+'</div>'):('<div class="photo-wrap" style="height:64px;background:var(--card2)">'+badges+domPill(x.dom)+'</div>');
  return '<div class="card">'+photo+'<div class="body"><h3>'+x.n+'</h3><div class="addr">'+x.a+'</div>'+
  '<div class="stats"><div><div class="v">'+money(x.p)+'</div><div class="l">Price</div></div>'+
  '<div><div class="v cap">'+(x.cap!=null?x.cap.toFixed(2)+'%':'—')+'</div><div class="l">Cap</div></div>'+
  '<div><div class="v">'+(x.sf!=null?x.sf.toLocaleString()+' SF':'—')+'</div><div class="l">Size</div></div>'+
  '<div><div class="v">'+(x.occ||'—')+'</div><div class="l">Occupancy</div></div></div>'+
  '<div class="notes"><b>'+x.ten+'</b> · '+x.notes+'</div>'+
  '<a class="btn" href="'+x.u+'" target="_blank" rel="noopener">View Listing →</a></div></div>';
}
function render(){
  const sort=document.getElementById('sort').value;
  const minCap=parseFloat(document.getElementById('minCap').value);
  const maxPrice=parseFloat(document.getElementById('maxPrice').value);
  const topOnly=document.getElementById('topOnly').checked;
  const matchOnly=document.getElementById('matchOnly').checked;
  let arr=L.filter(x=>(!topOnly||(x.dom!=null&&x.dom<=3))&&(!matchOnly||x.match)&&(isNaN(minCap)||(x.cap!=null&&x.cap>=minCap))&&(isNaN(maxPrice)||(x.p!=null&&x.p<=maxPrice)));
  const big=1e15;
  if(sort==='newest')arr.sort((a,b)=>(a.dom==null?999:a.dom)-(b.dom==null?999:b.dom));
  if(sort==='cap')arr.sort((a,b)=>(b.cap||-1)-(a.cap||-1));
  if(sort==='priceLow')arr.sort((a,b)=>(a.p||big)-(b.p||big));
  if(sort==='priceHigh')arr.sort((a,b)=>(b.p||0)-(a.p||0));
  if(sort==='sf')arr.sort((a,b)=>(b.sf||0)-(a.sf||0));
  document.getElementById('grid').innerHTML=arr.map(card).join('');
}
(function(){
  const newIn3=L.filter(x=>x.dom!=null&&x.dom<=3).length;
  const caps=L.filter(x=>x.cap!=null).map(x=>x.cap);
  const prices=L.filter(x=>x.p!=null).map(x=>x.p);
  const st=[[L.length,'Listings in report'],[newIn3,'⭐ New in past 3 days'],[caps.length?Math.min(...caps).toFixed(2)+'–'+Math.max(...caps).toFixed(2)+'%':'—','Cap range'],[prices.length?'$'+Math.min(...prices).toLocaleString()+' – $'+(Math.max(...prices)/1e6).toFixed(2)+'M':'—','Price range']];
  document.getElementById('statbar').innerHTML=st.map(s=>'<div class="stat"><div class="v">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('');
  document.getElementById('footer').innerHTML='Sources scanned 2026-07-15: Crexi (Dallas + Fort Worth, sorted by new listings — exact list dates), STRIVE, SRS (no new DFW retail-for-sale on newest page), Marcus &amp; Millichap (Dallas MSA, most-recent sort — dates not published), Matthews (TX retail, partial harvest — infinite scroll stalled), Colliers (Dallas + Fort Worth, date-sorted), NAI Robert Lynn (newest retail-sale entries by internal ID), SHOP Companies (newest-created feed).<br>Blocked/unavailable today: Secure Net Lease (listing app failed to load), CBRE (search page hangs), LoopNet (bot protection).<br>Listings without a published list date are marked "DOM n/a" — they are new to this report\'s tracker but may have been on market longer. ⭐ Top Pick = confirmed on market ≤ 3 days. Criteria Match = multi-tenant center, $2M–$50M.';
  ['sort','minCap','maxPrice','topOnly','matchOnly'].forEach(id=>document.getElementById(id).addEventListener(id==='sort'?'change':'input',render));
  render();
})();
</script>
