<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DFW Retail Report</title><style>
:root{--bg:#0d0d14;--gold:#e8a020;--card:#15151f;--tx:#e8e8ee;--mut:#8a8a9a;--g:#3ecf6e;--r:#e5534b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
header{padding:24px 16px 8px;max-width:1200px;margin:auto}h1{margin:0;color:var(--gold);font-size:26px}.sub{color:var(--mut);font-size:13px}
.stats{display:flex;gap:12px;flex-wrap:wrap;max-width:1200px;margin:12px auto;padding:0 16px}.stat{background:var(--card);padding:12px 16px;border-radius:10px;min-width:140px}.stat b{display:block;color:var(--gold);font-size:20px}.stat span{color:var(--mut);font-size:12px}
.bar{position:sticky;top:0;background:#0d0d14ee;backdrop-filter:blur(6px);padding:10px 16px;border-bottom:1px solid #2a2a3a;display:flex;gap:12px;flex-wrap:wrap;align-items:center;z-index:5;font-size:13px}
.bar input,.bar select{background:var(--card);color:var(--tx);border:1px solid #2a2a3a;border-radius:6px;padding:6px}.bar input[type=number]{width:110px}
.grid{max-width:1200px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid #22222f}
.badges{display:flex;gap:6px;flex-wrap:wrap}.b{font-size:11px;padding:3px 8px;border-radius:99px;background:#2a2a3a}.b.top{background:var(--gold);color:#000;font-weight:700}.b.crit{background:#1f3a2a;color:var(--g)}
.dom{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;color:#000;font-weight:600;width:fit-content}
h3{margin:0;font-size:16px}.addr{color:var(--mut);font-size:13px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sg div{background:#0d0d14;border-radius:8px;padding:8px}.sg span{display:block;color:var(--mut);font-size:11px}.sg b.cap{color:var(--gold)}
.note{font-size:13px;color:#b8b8c8}a.btn{margin-top:auto;text-align:center;background:var(--gold);color:#000;font-weight:700;padding:9px;border-radius:8px;text-decoration:none}
</style></head><body><header><h1>DFW Retail Report</h1><div class="sub">New-to-market listings &middot; 2026-10-14 &middot; sources: Crexi, STRIVE, Secure Net Lease, SRS, Marcus &amp; Millichap, Matthews, Colliers, CBRE, NAI Robert Lynn, LoopNet (404), SHOP</div></header>
<div class="stats"><div class="stat"><b>16</b><span>New listings</span></div><div class="stat"><b>5</b><span>New in 3 days</span></div><div class="stat"><b>4.00% - 6.50%</b><span>Cap range</span></div><div class="stat"><b>$0.95M - $8.2M</b><span>Price range</span></div></div>
<div class="bar"><label>Sort <select id="s"><option value="new">Newest</option><option value="cap">Cap rate</option><option value="pa">Price low-high</option><option value="pd">Price high-low</option></select></label><label>Min cap % <input id="mc" type="number" step="0.25"></label><label>Max price $ <input id="mp" type="number" step="100000"></label><label><input id="tp" type="checkbox"> Top picks only</label><label><input id="cm" type="checkbox"> Criteria match only</label></div>
<div class="grid" id="g"></div>
<script>const D=[{"id": 0, "src": "Crexi", "name": "High-Yield Commercial Investment (Church/Multi-Use)", "addr": "5007 Ivy Ln, Dallas, TX 75241", "url": "https://www.crexi.com/properties/1828318/", "price": 949900.0, "cap": null, "sf": "", "dom": 1, "top": true, "crit": false, "note": "Mixed use/special purpose, listed 2026-10-13"}, {"id": 1, "src": "Crexi", "name": "Sixt Rent A Car", "addr": "5800 Maple Ave, Dallas, TX 75235", "url": "https://www.crexi.com/properties/2745353/", "price": 6350000.0, "cap": null, "sf": "", "dom": 1, "top": true, "crit": false, "note": "Listed 2026-10-13, net lease"}, {"id": 2, "src": "Crexi", "name": "4701 Bengal Street", "addr": "4701 Bengal St, Dallas, TX 75235", "url": "https://www.crexi.com/properties/2745521/", "price": null, "cap": null, "sf": "", "dom": 1, "top": true, "crit": false, "note": "Unpriced, listed 2026-10-13"}, {"id": 3, "src": "Crexi", "name": "Thrive Pet Healthcare", "addr": "9605 Abrams Rd, Dallas, TX 75243", "url": "https://www.crexi.com/properties/2746228/", "price": 1915000.0, "cap": null, "sf": "", "dom": 0, "top": true, "crit": false, "note": "Listed 2026-10-14"}, {"id": 4, "src": "Crexi", "name": "IHOP (NNN, Placer AI 94th pct)", "addr": "4333 Dallas Fort Worth Turnpike, Dallas, TX 75212", "url": "https://www.crexi.com/properties/2746322/", "price": 3500000.0, "cap": null, "sf": "", "dom": 0, "top": true, "crit": false, "note": "Absolute NNN, listed 2026-10-14"}, {"id": 5, "src": "Matthews", "name": "Tom Thumb Grocer & Fuel Center", "addr": "2611 & 2601 W Park Row Dr, Arlington, TX 76013", "url": "https://www.matthews.com/properties/stnl-tom-thumb-grocer-fuel-center-arlington-tx", "price": 8200100.0, "cap": 5.75, "sf": "", "dom": null, "top": false, "crit": true, "note": "Term ~5.75 yrs"}, {"id": 6, "src": "Matthews", "name": "Former Wisdom Academy", "addr": "1935 Old Denton Rd, Carrollton, TX 75006", "url": "https://www.matthews.com/properties/stnl-former-wisdom-academy-carrollton-tx", "price": 995000.0, "cap": null, "sf": "4496", "dom": null, "top": false, "crit": false, "note": "$221/SF"}, {"id": 7, "src": "Matthews", "name": "Walgreens", "addr": "4001 FM 2181, Corinth, TX 76210", "url": "https://www.matthews.com/properties/stnl-walgreens-corinth-tx", "price": 5086000.0, "cap": 6.5, "sf": "13650", "dom": null, "top": false, "crit": false, "note": "NNN"}, {"id": 8, "src": "Matthews", "name": "Former QSR", "addr": "2783 Virginia Pkwy, McKinney, TX 75071", "url": "https://www.matthews.com/properties/stnl-2783-virginia-pkwy-mckinney-tx", "price": null, "cap": null, "sf": "880", "dom": null, "top": false, "crit": false, "note": ""}, {"id": 9, "src": "Matthews", "name": "Dutch Bros", "addr": "1070 N Beach St, Fort Worth, TX 76111", "url": "https://www.matthews.com/properties/stnl-dutch-bros-fort-worth-tx", "price": 3123800.0, "cap": 5.25, "sf": "986", "dom": null, "top": false, "crit": false, "note": "2026 build"}, {"id": 10, "src": "Matthews", "name": "Murphy USA", "addr": "McPherson Blvd & Chisholm Trail Pkwy, Fort Worth, TX 76123", "url": "https://www.matthews.com/properties/stnl-murphy-usa-fort-worth-tx", "price": 3560000.0, "cap": 5.0, "sf": "", "dom": null, "top": false, "crit": false, "note": "2026 build"}, {"id": 11, "src": "Matthews", "name": "The Shops at Lakefront", "addr": "2009 Oak Grove Pkwy, Little Elm, TX 75068", "url": "https://www.matthews.com/properties/stnl-the-shops-at-lakefront-little-elm-tx", "price": null, "cap": null, "sf": "8650", "dom": null, "top": false, "crit": false, "note": "Multi-tenant retail, unpriced"}, {"id": 12, "src": "Matthews", "name": "Denton Pad Sites", "addr": "1400 N Loop 288, Denton, TX 76209", "url": "https://www.matthews.com/properties/denton-pad-sites-denton-tx-matthews", "price": null, "cap": null, "sf": "", "dom": null, "top": false, "crit": false, "note": "9 pad sites (land)"}, {"id": 13, "src": "Matthews", "name": "CleanSmart Express Car Wash", "addr": "2520 E Plano Pkwy, Plano, TX 75074", "url": "https://www.matthews.com/properties/stnl-cleansmart-express-car-wash-plano-tx", "price": 4500000.0, "cap": null, "sf": "4995", "dom": null, "top": false, "crit": false, "note": ""}, {"id": 14, "src": "Matthews", "name": "McDonald's", "addr": "NWC Chisholm Trail Pkwy & McPherson Blvd, Fort Worth, TX 76123", "url": "https://www.matthews.com/properties/stnl-mcdonalds-fort-worth-tx", "price": 3699999.0, "cap": 4.0, "sf": "", "dom": null, "top": false, "crit": false, "note": ""}, {"id": 15, "src": "CBRE", "name": "Champions West (pad sites + 10,800 SF shop bldg)", "addr": "SWQ Hwy 114 & I-35W, Fort Worth, TX 76177", "url": "https://www.cbre.com/properties/properties-for-lease/commercial-space/details/US-SMPL-83509/champions-west-swq-hwy-114-i-35w-fort-worth-tx-76177", "price": null, "cap": null, "sf": "", "dom": null, "top": false, "crit": false, "note": "1-14 ac pads, ~19.5 ac total; shop bldg Q1 2027; listed for sale/lease"}];
const $=i=>document.getElementById(i);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function money(p){return p?'$'+p.toLocaleString():'Unpriced'}
function dc(d){if(d==null)return['#9a9aa8','DOM n/a'];return[d<=30?'#3ecf6e':d<=90?'#e8a020':'#e5534b',d+(d==1?' day':' days')+' on market']}
function render(){let a=D.slice();const mc=parseFloat($('mc').value),mp=parseFloat($('mp').value);
if(!isNaN(mc))a=a.filter(x=>x.cap!=null&&x.cap>=mc);if(!isNaN(mp))a=a.filter(x=>x.price==null||x.price<=mp);
if($('tp').checked)a=a.filter(x=>x.top);if($('cm').checked)a=a.filter(x=>x.crit);
const s=$('s').value;a.sort((x,y)=>s=='cap'?(y.cap||0)-(x.cap||0):s=='pa'?(x.price||1e12)-(y.price||1e12):s=='pd'?(y.price||0)-(x.price||0):(x.dom==null?999:x.dom)-(y.dom==null?999:y.dom));
$('g').innerHTML=a.map(function(x){var r=dc(x.dom),c=r[0],t=r[1];var sf=x.sf?(isNaN(x.sf)?esc(x.sf):Number(x.sf).toLocaleString()+' SF'):'n/a';
return '<div class="card"><div class="badges">'+(x.top?'<span class="b top">&#11088; Top Pick</span>':'')+'<span class="b">'+esc(x.src)+'</span>'+(x.crit?'<span class="b crit">Criteria Match</span>':'')+'</div><span class="dom" style="background:'+c+'">'+t+'</span><h3>'+esc(x.name)+'</h3><div class="addr">'+esc(x.addr)+'</div><div class="sg"><div><span>Price</span><b>'+money(x.price)+'</b></div><div><span>Cap</span><b class="cap">'+(x.cap?x.cap+'%':'n/a')+'</b></div><div><span>Size</span><b>'+sf+'</b></div><div><span>Occupancy</span><b>'+(/occ/.test(x.sf)?esc(x.sf):'n/a')+'</b></div></div><div class="note">'+esc(x.note)+'</div><a class="btn" href="'+esc(x.url)+'" target="_blank" rel="noopener">View Listing</a></div>'}).join('')}
['s','mc','mp','tp','cm'].forEach(i=>$(i).addEventListener('input',render));render();
</script></body></html>
